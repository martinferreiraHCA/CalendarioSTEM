<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Espacio STEM — Agenda</title>
<style>
/* ============================================================
   AGENDA DEL ESPACIO — blanco y negro, hairlines, sin color.
   Jerarquía por peso tipográfico, inversión y filete.
   ============================================================ */

:root{
  --ink:#000;
  --paper:#fff;
  --rule:#000;
  --hair:1px;
  --pad:clamp(10px,2vw,16px);
  --fs-base:clamp(15px,1.6vw,17px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
@supports (height:100dvh){ html,body,#app{height:100dvh;} }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Roboto,Arial,sans-serif;
  font-size:var(--fs-base);
  line-height:1.25;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}

/* ---------- estructura ---------- */
#app{display:flex;flex-direction:column;height:100%;}

/* ---------- cabecera ---------- */
header{
  border-bottom:3px solid var(--rule);
  padding:10px var(--pad) 8px var(--pad);
  flex:0 0 auto;
}
.top{display:flex;align-items:flex-end;}
.space-name{
  flex:1 1 auto;
  font-size:15px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  padding-bottom:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.clock{
  flex:0 0 auto;
  font-size:clamp(26px,4.5vw,40px);
  font-weight:700;
  letter-spacing:-.02em;
  line-height:.95;
}
.clock .dow{
  display:block;
  font-size:12px;
  font-weight:400;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-align:right;
  margin-top:4px;
}

.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 0;margin-top:9px;}
.range{
  flex:1 1 auto;
  font-size:19px;
  font-weight:400;
  letter-spacing:.02em;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
}
.range b{font-weight:700;}

button{
  font-family:inherit;
  font-size:15px;
  color:var(--ink);
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:0;
  padding:0 14px;
  height:44px;
  line-height:40px;
  cursor:pointer;
  letter-spacing:.06em;
  text-transform:uppercase;
  -webkit-appearance:none;appearance:none;
  touch-action:manipulation;
}
button:active{background:var(--ink);color:var(--paper);}
button:focus{outline:2px solid var(--ink);outline-offset:2px;}
button[disabled]{opacity:.28;}
.tabs{flex:0 0 auto;display:flex;margin-right:8px;}
.tabs button{border-right-width:0;min-width:96px;}
.tabs button:last-child{border-right-width:2px;}
.tabs button.on{background:var(--ink);color:var(--paper);}
.nav{flex:0 0 auto;display:flex;margin-right:8px;}
.nav button{width:52px;padding:0;border-right-width:0;font-size:22px;line-height:38px;}
.nav button:last-child{border-right-width:2px;}
.nav #today{width:auto;padding:0 12px;font-size:15px;}
.book{flex:0 0 auto;font-weight:700;background:var(--ink);color:var(--paper);}
.book:active{background:var(--paper);color:var(--ink);}

/* ---------- lienzo ---------- */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
/* En vista mes la grilla llena el alto disponible; solo aparece scroll
   si el contenido no entra ni apretándose. */
main.month table.month{height:100%;}

/* ---------- vista semana ---------- */
.day{display:flex;border-bottom:var(--hair) solid var(--rule);min-height:74px;}
.day:last-child{border-bottom:0;}
.day .gutter{
  flex:0 0 96px;
  border-right:var(--hair) solid var(--rule);
  padding:9px 10px 9px var(--pad);
  text-align:right;
}
.day .dnum{font-size:31px;font-weight:700;line-height:.9;letter-spacing:-.03em;}
.day .dname{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:5px;}
.day.today .gutter{background:var(--ink);color:var(--paper);}
.day.past .gutter{color:var(--ink);opacity:.4;}
.day .slots{flex:1 1 auto;min-width:0;}

.ev{
  display:flex;
  align-items:baseline;
  padding:9px 14px 9px 12px;
  border-bottom:var(--hair) dotted var(--rule);
}
.ev:last-child{border-bottom:0;}
.ev .time{
  flex:0 0 118px;
  font-size:16px;
  font-weight:700;
  letter-spacing:.01em;
}
.ev .time small{display:block;font-size:13px;font-weight:400;letter-spacing:0;}
.ev .body{flex:1 1 auto;min-width:0;}
.ev .title{font-size:19px;font-weight:400;word-wrap:break-word;}
.ev .meta{font-size:13px;margin-top:3px;letter-spacing:.04em;text-transform:uppercase;}
.ev.now{background:var(--ink);color:var(--paper);}
.ev.now .title{font-weight:700;}
.ev.done .time,.ev.done .title,.ev.done .meta{opacity:.42;}
.ev .tag{
  display:inline-block;border:var(--hair) solid currentColor;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  padding:1px 5px;margin-right:6px;vertical-align:1px;
}
.empty{padding:12px 14px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;opacity:.35;}

/* ---------- vista mes (tabla: máxima compatibilidad) ---------- */
table.month{width:100%;border-collapse:collapse;table-layout:fixed;}
table.month th{
  font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;
  padding:7px 4px;border-bottom:2px solid var(--rule);
}
table.month td{
  border-right:var(--hair) solid var(--rule);
  border-bottom:var(--hair) solid var(--rule);
  vertical-align:top;
  padding:4px 5px 6px 5px;
  height:44px; /* mínimo; la tabla al 100% reparte el alto sobrante */
  overflow:hidden;
}
table.month td:last-child{border-right:0;}
table.month td.out{opacity:.3;}
.mnum{font-size:17px;font-weight:700;line-height:1;}
td.today .mnum{
  background:var(--ink);color:var(--paper);
  display:inline-block;padding:3px 6px;margin:-2px 0 0 -2px;
}
.mev{
  font-size:12px;line-height:1.2;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-left:3px solid var(--ink);padding-left:5px;
}
.mmore{font-size:11px;margin-top:4px;letter-spacing:.1em;opacity:.55;}

/* ---------- vista día: carrusel de tarjetas ---------- */
main.dayview{overflow:hidden;}
.carousel{position:relative;height:100%;overflow:hidden;touch-action:pan-y;cursor:grab;}
.carousel:active{cursor:grabbing;}
.track{display:flex;height:100%;will-change:transform;}
.card{
  flex:0 0 100%;min-width:0;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px var(--pad) 56px var(--pad);
  border-right:var(--hair) solid var(--rule);
}
.card .c-status{
  border:2px solid currentColor;padding:3px 12px;
  font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  margin-bottom:20px;
}
.card .c-time{font-size:clamp(26px,6vw,46px);font-weight:700;letter-spacing:-.02em;}
.card .c-title{
  font-size:clamp(22px,5vw,38px);font-weight:400;line-height:1.15;
  margin-top:14px;max-width:26ch;overflow-wrap:break-word;
}
.card .c-meta{margin-top:14px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;}
.card .c-hint{margin-top:18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.45;}
.card.now{background:var(--ink);color:var(--paper);}
.card.done{opacity:.45;}
.dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;}
.dot{width:10px;height:10px;border:2px solid var(--ink);background:var(--paper);margin:0 5px;}
.dot.on{background:var(--ink);}

/* ---------- pie ---------- */
footer{
  flex:0 0 auto;
  border-top:var(--hair) solid var(--rule);
  padding:6px var(--pad) calc(6px + env(safe-area-inset-bottom,0px)) var(--pad);
  display:flex;
  font-size:11px;
  letter-spacing:.13em;
  text-transform:uppercase;
}
footer .l{flex:1 1 auto;}
footer .r{flex:0 0 auto;}
footer.warn{background:var(--ink);color:var(--paper);}

/* ---------- panel de reserva ---------- */
#shade{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.45);
  display:none;z-index:19;
}
#shade.on{display:block;}
#sheet{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:var(--paper);
  display:none;
  flex-direction:column;
  z-index:20;
}
#sheet.open{display:flex;}
/* En pantallas amplias, el panel pasa a ser un modal centrado. */
@media (min-width:760px) and (min-height:560px){
  #sheet{
    top:50%;left:50%;right:auto;bottom:auto;
    transform:translate(-50%,-50%);
    width:min(600px,92vw);
    max-height:min(90vh,760px);
    border:3px solid var(--ink);
    box-shadow:10px 10px 0 var(--ink);
  }
}
.sh-top{
  flex:0 0 auto;display:flex;align-items:center;
  border-bottom:3px solid var(--rule);padding:10px var(--pad);
}
.sh-top h2{flex:1 1 auto;margin:0;font-size:20px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;}
.sh-body{flex:1 1 auto;overflow-y:auto;padding:0 var(--pad) 16px var(--pad);}
.sh-foot{flex:0 0 auto;border-top:var(--hair) solid var(--rule);padding:10px var(--pad);display:flex;}
.sh-foot .grow{flex:1 1 auto;}

.field{margin-top:16px;}
.field>label{
  display:block;font-size:11px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;margin-bottom:6px;
}
input[type=text],input[type=time],textarea,select{
  width:100%;font-family:inherit;font-size:19px;color:var(--ink);
  background:var(--paper);border:2px solid var(--ink);border-radius:0;
  padding:11px 12px;-webkit-appearance:none;appearance:none;
}
select{background-image:none;}
textarea{resize:none;height:74px;font-size:16px;}
input:focus,textarea:focus,select:focus{outline:3px solid var(--ink);outline-offset:-1px;}
.row{display:flex;}
.row>div{flex:1 1 0;padding-right:8px;}
.row>div:last-child{padding-right:0;}

.chips{display:flex;flex-wrap:wrap;}
.chip{
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  font-size:15px;letter-spacing:.04em;text-transform:none;
  height:44px;line-height:40px;padding:0 15px;margin:0 8px 8px 0;
}
.chip.on{background:var(--ink);color:var(--paper);font-weight:700;}

#msg{margin-top:16px;border:2px solid var(--ink);padding:10px 12px;font-size:15px;display:none;}
#msg.on{display:block;}
#msg.bad{background:var(--ink);color:var(--paper);}

.pill{
  display:inline-block;border:var(--hair) solid var(--ink);
  padding:2px 7px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--ink);display:none;z-index:30;}
.busy.on{display:block;}

/* ---------- responsive ---------- */

/* Pantallas grandes (TV / monitor de kiosco) */
@media (min-width:1200px){
  :root{--fs-base:18px;}
  .day{min-height:84px;}
  .ev .title{font-size:21px;}
}

/* Tablet angosta / teléfono grande: la fila de controles se parte en dos */
@media (max-width:720px){
  .range{flex:1 1 100%;order:2;}
  .nav,.tabs{order:1;}
  .book{order:1;margin-left:auto;}
  .tabs button{min-width:76px;}
}

/* Teléfono */
@media (max-width:640px){
  .space-name{letter-spacing:.14em;font-size:13px;}
  .day .gutter{flex-basis:64px;padding-left:8px;padding-right:8px;}
  .day .dnum{font-size:26px;}
  .ev{padding-left:10px;padding-right:10px;}
  .ev .time{flex-basis:88px;font-size:15px;}
  .ev .title{font-size:17px;}
  table.month td{padding:3px 3px 4px 3px;}
  .mnum{font-size:14px;}
  /* Los eventos del mes se vuelven marcas cuadradas: el detalle vive en Semana */
  .mev{
    display:inline-block;width:8px;height:8px;margin:5px 4px 0 0;
    padding:0;border-left:0;background:var(--ink);
    overflow:hidden;font-size:0;line-height:0;vertical-align:top;
  }
  .mmore{display:inline-block;margin:3px 0 0 0;font-size:10px;}
  footer{font-size:10px;letter-spacing:.08em;}
}

/* Teléfono chico: horario y título del evento en columna */
@media (max-width:440px){
  .top{flex-wrap:wrap;}
  .space-name{flex:1 1 100%;padding-bottom:2px;}
  .clock{margin-left:auto;display:flex;align-items:baseline;gap:8px;}
  .clock .dow{margin-top:0;}
  .nav button{width:44px;}
  .nav #today{width:auto;padding:0 10px;font-size:14px;}
  .tabs button{min-width:0;padding:0 10px;}
  .book{padding:0 10px;}
  .ev{display:block;}
  .ev .time{font-size:14px;}
  .ev .time small{display:inline;margin-left:6px;}
  .ev .title{font-size:16px;margin-top:2px;}
  .row{display:block;}
  .row>div{padding-right:0;}
}

/* Poca altura (teléfono apaisado): compactar cabecera */
@media (max-height:480px){
  header{padding-top:6px;padding-bottom:5px;}
  .clock{font-size:24px;}
  .clock .dow{display:none;}
  .bar{margin-top:5px;}
  .day{min-height:56px;}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="busy" id="busy"></div>

<div id="app">
  <header>
    <div class="top">
      <div class="space-name" id="spaceName">Espacio</div>
      <div class="clock num"><span id="clock">--:--</span><span class="dow" id="todayLabel"></span></div>
    </div>
    <div class="bar">
      <div class="range num" id="range">Cargando</div>
      <div class="nav">
        <button id="prev" aria-label="Anterior">&#8249;</button>
        <button id="today">Hoy</button>
        <button id="next" aria-label="Siguiente">&#8250;</button>
      </div>
      <div class="tabs">
        <button id="tabWeek" class="on">Semana</button>
        <button id="tabMonth">Mes</button>
        <button id="tabDay">Actividades del día</button>
      </div>
      <button class="book" id="openBook">+ Reservar</button>
    </div>
  </header>

  <main id="view"></main>

  <footer id="foot">
    <div class="l" id="status">Conectando con el calendario</div>
    <div class="r num" id="updated"></div>
  </footer>
</div>

<div id="shade"></div>

<div id="sheet">
  <div class="sh-top">
    <h2>Nueva reserva</h2>
    <button id="closeBook">Cancelar</button>
  </div>
  <div class="sh-body">
    <div class="field">
      <label for="fTitle">Actividad</label>
      <input type="text" id="fTitle" autocomplete="off" placeholder="Taller de robótica">
    </div>
    <div class="field">
      <label for="fWho">A nombre de</label>
      <input type="text" id="fWho" autocomplete="off" placeholder="Nombre de quien reserva">
    </div>
    <div class="field">
      <label>Día</label>
      <div class="chips" id="dayChips"></div>
    </div>
    <div class="field">
      <label>Horario</label>
      <div class="chips" id="modeChips">
        <button class="chip on" id="modeManual" type="button">Manual</button>
        <button class="chip" id="modeSec" type="button">Módulos de secundaria</button>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="fStart">Empieza</label>
        <input type="time" id="fStart" step="300">
      </div>
      <div class="field" id="durField">
        <label for="fDur">Dura</label>
        <select id="fDur"></select>
      </div>
      <div class="field" id="modsField" style="display:none">
        <label for="fMods">Módulos</label>
        <select id="fMods"></select>
      </div>
    </div>
    <div class="field">
      <label for="fNotes">Notas (opcional)</label>
      <textarea id="fNotes" placeholder="Materiales, cantidad de personas, disposición de la sala"></textarea>
    </div>
    <div class="field" id="pinField" style="display:none">
      <label for="fPin">Código de gestión</label>
      <input type="text" id="fPin" inputmode="numeric" autocomplete="off">
    </div>
    <div id="msg"></div>
  </div>
  <div class="sh-foot">
    <div class="grow"></div>
    <button class="book" id="saveBook">Guardar reserva</button>
  </div>
</div>

<script>
/* ============================================================
   1. CONFIGURACIÓN — lo único que tenés que tocar
   ============================================================ */
var CONFIG = {
  // URL /exec de la Web App de Apps Script (ver README).
  API_URL: 'https://script.google.com/macros/s/AKfycbyHUAQe8p2XkzqljPylAPZwg1NAIRh2iHpd6IZoUbAgGWuf5FmG7vfN8Sz0o3J_S9qeWA/exec',

  SPACE_NAME: 'Espacio STEM',

  // Código para poder guardar reservas. '' = sin código.
  PIN: '',

  OPEN_HOUR: 7,           // primera hora reservable
  CLOSE_HOUR: 19,         // última hora reservable
  SLOT_MINUTES: 30,       // redondeo de la hora sugerida al abrir el formulario
  DURATIONS: [30, 60, 90, 120, 180, 240],

  // Modo "módulos de secundaria": duración = cantidad × minutos por módulo.
  MODULE_MINUTES: 45,
  MAX_MODULES: 8,
  BOOK_DAYS_AHEAD: 21,    // días que ofrece el selector de día

  REFRESH_MS: 180000,     // recarga de datos: 3 min
  IDLE_RESET_MS: 90000,   // vuelve a la semana actual: 90 s sin tocar
  SHOW_MONTH_ON_IDLE: false
};

/* ============================================================
   2. UTILIDADES DE FECHA (semana de lunes a domingo)
   ============================================================ */
var DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var DOW_LONG = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function pad2(n){ n = String(n); return n.length < 2 ? '0' + n : n; }
function startOfDay(d){ var x = new Date(d.getTime()); x.setHours(0,0,0,0); return x; }
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function addMonths(d, n){ var x = new Date(d.getTime()); x.setDate(1); x.setMonth(x.getMonth() + n); return x; }
function mondayOf(d){
  var x = startOfDay(d);
  var w = x.getDay();              // 0 = domingo
  var back = (w === 0) ? 6 : w - 1;
  return addDays(x, -back);
}
function sameDay(a, b){
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function hhmm(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

/* ============================================================
   3. ESTADO
   ============================================================ */
var state = {
  mode: 'week',        // 'week' | 'month'
  anchor: new Date(),  // día de referencia de la vista
  events: [],
  loadedFrom: null,
  loadedTo: null,
  lastUpdate: null,
  lastTouch: Date.now(),
  offline: false,
  form: { day: startOfDay(new Date()), timeMode: 'manual' }
};

function $(id){ return document.getElementById(id); }

/* ============================================================
   4. RED
   ============================================================ */
function busy(on){ $('busy').className = on ? 'busy on' : 'busy'; }

function apiGet(from, to, cb){
  var url = CONFIG.API_URL + '?action=list&from=' + ymd(from) + '&to=' + ymd(to) + '&t=' + Date.now();
  busy(true);
  fetch(url, { method:'GET' })
    .then(function(r){ return r.json(); })
    .then(function(j){ busy(false); cb(null, j); })
    .catch(function(e){ busy(false); cb(e); });
}

function apiCreate(payload, cb){
  busy(true);
  // text/plain evita el preflight CORS, que Apps Script no responde.
  fetch(CONFIG.API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
    .then(function(r){ return r.json(); })
    .then(function(j){ busy(false); cb(null, j); })
    .catch(function(e){ busy(false); cb(e); });
}

/* ============================================================
   5. CARGA Y DIBUJO
   ============================================================ */
function visibleRange(){
  if (state.mode === 'day'){
    var s = startOfDay(state.anchor);
    return { from: s, to: s };
  }
  if (state.mode === 'week'){
    var a = mondayOf(state.anchor);
    return { from: a, to: addDays(a, 6) };
  }
  var first = new Date(state.anchor.getFullYear(), state.anchor.getMonth(), 1);
  var last  = new Date(state.anchor.getFullYear(), state.anchor.getMonth() + 1, 0);
  return { from: mondayOf(first), to: addDays(mondayOf(last), 6) };
}

function load(){
  var r = visibleRange();
  apiGet(addDays(r.from, -1), addDays(r.to, 1), function(err, res){
    if (err || !res || !res.ok){
      state.offline = true;
      setStatus(err ? 'Sin conexión con el calendario' : ('El calendario respondió: ' + ((res && res.error) || 'error')));
      render();
      return;
    }
    state.offline = false;
    state.events = (res.events || []).map(function(e){
      return {
        id: e.id,
        title: e.title || '(sin título)',
        start: new Date(e.start),
        end: new Date(e.end),
        allDay: !!e.allDay,
        who: e.who || '',
        location: e.location || ''
      };
    }).sort(function(a,b){ return a.start - b.start; });
    state.lastUpdate = new Date();
    setStatus('');
    render();
  });
}

function setStatus(txt){
  var f = $('foot');
  if (txt){
    $('status').textContent = txt;
    f.className = 'warn';
  } else {
    var n = state.events.length;
    $('status').textContent = n + (n === 1 ? ' actividad en pantalla' : ' actividades en pantalla');
    f.className = '';
  }
  $('updated').textContent = state.lastUpdate ? ('Actualizado ' + hhmm(state.lastUpdate)) : '';
}

function eventsOfDay(d){
  var s = startOfDay(d), e = addDays(s, 1);
  return state.events.filter(function(ev){ return ev.start < e && ev.end > s; });
}

function render(){
  if (state.mode === 'day' && dayC.dragging) return; // no repintar a mitad de un swipe
  $('spaceName').textContent = CONFIG.SPACE_NAME;
  $('tabWeek').className = state.mode === 'week' ? 'on' : '';
  $('tabMonth').className = state.mode === 'month' ? 'on' : '';
  $('tabDay').className = state.mode === 'day' ? 'on' : '';
  $('view').className = state.mode === 'month' ? 'month' : (state.mode === 'day' ? 'dayview' : '');
  if (state.mode === 'week') renderWeek();
  else if (state.mode === 'month') renderMonth();
  else renderDay();
  setStatus(state.offline ? 'Sin conexión con el calendario' : '');
}

function renderWeek(){
  var start = mondayOf(state.anchor), now = new Date();
  var end = addDays(start, 6);
  var sameMonth = start.getMonth() === end.getMonth();
  $('range').innerHTML = sameMonth
    ? ('<b>' + start.getDate() + '&ndash;' + end.getDate() + '</b> ' + MONTHS[start.getMonth()] + ' ' + start.getFullYear())
    : ('<b>' + start.getDate() + ' ' + MONTHS[start.getMonth()].slice(0,3) + ' &ndash; ' + end.getDate() + ' ' + MONTHS[end.getMonth()].slice(0,3) + '</b> ' + end.getFullYear());

  var html = '';
  for (var i = 0; i < 7; i++){
    var d = addDays(start, i);
    var isToday = sameDay(d, now);
    var isPast = startOfDay(d) < startOfDay(now);
    var evs = eventsOfDay(d);

    html += '<div class="day' + (isToday ? ' today' : '') + (isPast ? ' past' : '') + '">';
    html += '<div class="gutter"><div class="dnum num">' + pad2(d.getDate()) + '</div><div class="dname">' + DOW[d.getDay()] + '</div></div>';
    html += '<div class="slots">';

    if (!evs.length){
      html += '<div class="empty">Libre</div>';
    } else {
      for (var k = 0; k < evs.length; k++){
        var ev = evs[k];
        var isNow = ev.start <= now && ev.end > now;
        var isDone = ev.end <= now;
        var cls = 'ev' + (isNow ? ' now' : (isDone ? ' done' : ''));
        var timeHtml;
        if (ev.allDay){
          timeHtml = 'Todo el día';
        } else {
          var a = ev.start < startOfDay(d) ? '&larr; ' + hhmm(ev.start) : hhmm(ev.start);
          timeHtml = a + '<small>hasta ' + hhmm(ev.end) + '</small>';
        }
        html += '<div class="' + cls + '">';
        html += '<div class="time num">' + timeHtml + '</div>';
        html += '<div class="body"><div class="title">' + esc(ev.title) + '</div>';
        var meta = [];
        if (isNow) meta.push('<span class="tag">En curso</span>');
        if (ev.who) meta.push(esc(ev.who));
        if (ev.location) meta.push(esc(ev.location));
        if (meta.length) html += '<div class="meta">' + meta.join(' &middot; ') + '</div>';
        html += '</div></div>';
      }
    }
    html += '</div></div>';
  }
  $('view').innerHTML = html;
}

function renderMonth(){
  var a = state.anchor, now = new Date();
  var first = new Date(a.getFullYear(), a.getMonth(), 1);
  var last = new Date(a.getFullYear(), a.getMonth() + 1, 0);
  $('range').innerHTML = '<b>' + MONTHS[a.getMonth()] + '</b> ' + a.getFullYear();

  var cur = mondayOf(first);
  var stop = addDays(mondayOf(last), 7);
  var html = '<table class="month"><thead><tr>';
  var order = [1,2,3,4,5,6,0];
  for (var i = 0; i < 7; i++) html += '<th>' + DOW[order[i]] + '</th>';
  html += '</tr></thead><tbody>';

  while (cur < stop){
    html += '<tr>';
    for (var c = 0; c < 7; c++){
      var d = addDays(cur, c);
      var out = d.getMonth() !== a.getMonth();
      var evs = eventsOfDay(d);
      html += '<td class="' + (out ? 'out' : '') + (sameDay(d, now) ? ' today' : '') + '">';
      html += '<div class="mnum num">' + d.getDate() + '</div>';
      for (var k = 0; k < evs.length && k < 3; k++){
        var t = evs[k].allDay ? '' : hhmm(evs[k].start) + ' ';
        html += '<div class="mev"><span class="num">' + t + '</span>' + esc(evs[k].title) + '</div>';
      }
      if (evs.length > 3) html += '<div class="mmore">+' + (evs.length - 3) + ' más</div>';
      html += '</td>';
    }
    html += '</tr>';
    cur = addDays(cur, 7);
  }
  $('view').innerHTML = html + '</tbody></table>';
}

/* ---------- vista día: carrusel ---------- */
var dayC = { idx: 0, dragging: false, slideFrom: 0, speed: 0 };

function renderDay(){
  var d = startOfDay(state.anchor), now = new Date();
  $('range').innerHTML = '<b>' + DOW_LONG[d.getDay()] + '</b> ' + d.getDate() + ' ' +
    MONTHS[d.getMonth()] + ' ' + d.getFullYear();

  var evs = eventsOfDay(d);
  var n = Math.max(evs.length, 1);
  if (dayC.idx === 'last') dayC.idx = n - 1;
  if (dayC.idx > n - 1) dayC.idx = n - 1;
  if (dayC.idx < 0) dayC.idx = 0;

  var html = '<div class="carousel" id="car"><div class="track" id="track">';
  if (!evs.length){
    html += '<div class="card"><div class="c-time">Libre</div>' +
            '<div class="c-title">Sin actividades este día</div>' +
            '<div class="c-hint">Deslizá para ver otro día</div></div>';
  } else {
    for (var i = 0; i < evs.length; i++){
      var ev = evs[i];
      var isNow = ev.start <= now && ev.end > now;
      var isDone = ev.end <= now;
      html += '<div class="card' + (isNow ? ' now' : (isDone ? ' done' : '')) + '">';
      html += '<div class="c-status">' + (isNow ? 'En curso' : (isDone ? 'Terminada' : 'Próxima')) + '</div>';
      html += '<div class="c-time num">' + (ev.allDay ? 'Todo el día' : hhmm(ev.start) + ' &ndash; ' + hhmm(ev.end)) + '</div>';
      html += '<div class="c-title">' + esc(ev.title) + '</div>';
      var meta = [];
      if (ev.who) meta.push(esc(ev.who));
      if (ev.location) meta.push(esc(ev.location));
      if (meta.length) html += '<div class="c-meta">' + meta.join(' &middot; ') + '</div>';
      html += '<div class="c-hint">' + (i + 1) + ' de ' + evs.length + ' &middot; Deslizá</div>';
      html += '</div>';
    }
  }
  html += '</div><div class="dots">';
  for (var k = 0; k < n; k++) html += '<span class="dot' + (k === dayC.idx ? ' on' : '') + '"></span>';
  html += '</div></div>';
  $('view').innerHTML = html;

  bindCarousel();

  var track = $('track'), W = $('car').clientWidth;
  if (dayC.slideFrom){
    // Venimos de otro día: la tarjeta entra desde el lado del swipe.
    var from = -dayC.idx * W + dayC.slideFrom * W;
    track.style.transition = 'none';
    track.style.transform = 'translateX(' + from + 'px)';
    var ms = slideMs(W, dayC.speed);
    dayC.slideFrom = 0;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        track.style.transition = 'transform ' + ms + 'ms cubic-bezier(.2,.7,.3,1)';
        track.style.transform = 'translateX(' + (-dayC.idx * W) + 'px)';
      });
    });
  } else {
    track.style.transition = 'none';
    track.style.transform = 'translateX(' + (-dayC.idx * W) + 'px)';
  }
}

// Duración de la animación según la velocidad del gesto (px/ms):
// swipe rápido = animación corta; suelto lento = animación tranquila.
function slideMs(dist, speed){
  return Math.max(130, Math.min(450, dist / Math.max(speed, 0.6)));
}

function changeDay(dir, speed){
  state.anchor = addDays(state.anchor, dir);
  dayC.idx = dir > 0 ? 0 : 'last';
  dayC.slideFrom = dir;
  dayC.speed = speed || 0;
  render();
  load();
}

function animateToCard(target, speed){
  var track = $('track'), car = $('car');
  if (!track) return;
  var W = car.clientWidth;
  var dist = Math.abs(target * W + carTranslate(track));
  dayC.idx = target;
  track.style.transition = 'transform ' + slideMs(Math.max(dist, W * 0.2), speed) + 'ms cubic-bezier(.2,.7,.3,1)';
  track.style.transform = 'translateX(' + (-target * W) + 'px)';
  var dots = $('view').querySelectorAll('.dot');
  for (var i = 0; i < dots.length; i++) dots[i].className = i === target ? 'dot on' : 'dot';
}

function carTranslate(track){
  var m = /-?[\d.]+/.exec(track.style.transform || '');
  return m ? parseFloat(m[0]) : 0;
}

function bindCarousel(){
  var car = $('car'), track = $('track');
  if (!car) return;
  var startX = 0, curX = 0, lastX = 0, lastT = 0, vel = 0, active = false;

  function down(x, t){
    active = true; dayC.dragging = true;
    startX = curX = lastX = x; lastT = t; vel = 0;
    track.style.transition = 'none';
  }
  function move(x, t){
    if (!active) return;
    curX = x;
    var dt = t - lastT;
    if (dt > 0){
      // velocidad suavizada en px/ms
      vel = 0.75 * vel + 0.25 * ((x - lastX) / dt);
      lastX = x; lastT = t;
    }
    track.style.transform = 'translateX(' + (-dayC.idx * car.clientWidth + (curX - startX)) + 'px)';
  }
  function up(){
    if (!active) return;
    active = false; dayC.dragging = false;
    var W = car.clientWidth;
    var dx = curX - startX;
    // Proyección por inercia: cuanto más rápido el swipe, más lejos llega.
    var proj = dx + vel * 260;
    var delta = Math.round(-proj / W);
    // Umbral mínimo para pasar de tarjeta aunque el gesto sea corto o lento.
    var thresh = Math.min(W * 0.2, 120);
    if (delta === 0 && Math.abs(proj) > thresh) delta = proj < 0 ? 1 : -1;

    var evs = eventsOfDay(startOfDay(state.anchor));
    var n = Math.max(evs.length, 1);
    var speed = Math.abs(vel);
    var target = dayC.idx + delta;
    if (target < 0){ changeDay(-1, speed); return; }
    if (target > n - 1){ changeDay(1, speed); return; }
    animateToCard(target, speed);
  }

  if (window.PointerEvent){
    car.addEventListener('pointerdown', function(e){
      car.setPointerCapture(e.pointerId);
      down(e.clientX, e.timeStamp);
    });
    car.addEventListener('pointermove', function(e){ move(e.clientX, e.timeStamp); });
    car.addEventListener('pointerup', up);
    car.addEventListener('pointercancel', up);
  } else {
    car.addEventListener('touchstart', function(e){ down(e.touches[0].clientX, e.timeStamp); }, {passive:true});
    car.addEventListener('touchmove', function(e){ move(e.touches[0].clientX, e.timeStamp); }, {passive:true});
    car.addEventListener('touchend', up);
    car.addEventListener('touchcancel', up);
  }
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   6. NAVEGACIÓN
   ============================================================ */
function go(delta){
  if (state.mode === 'day'){ changeDay(delta, 0); return; }
  state.anchor = state.mode === 'week' ? addDays(state.anchor, 7 * delta) : addMonths(state.anchor, delta);
  render();
  load();
}
function goToday(){ state.anchor = new Date(); render(); load(); }
function setMode(m){ state.mode = m; render(); load(); }

$('prev').onclick = function(){ touch(); go(-1); };
$('next').onclick = function(){ touch(); go(1); };
$('today').onclick = function(){ touch(); goToday(); };
$('tabWeek').onclick = function(){ touch(); setMode('week'); };
$('tabMonth').onclick = function(){ touch(); setMode('month'); };
$('tabDay').onclick = function(){ touch(); dayC.idx = 0; setMode('day'); };

/* ============================================================
   7. FORMULARIO DE RESERVA
   ============================================================ */
function fmtMins(mins){
  if (mins < 60) return mins + ' min';
  return mins % 60 === 0 ? (mins/60) + ' h' : Math.floor(mins/60) + ' h ' + (mins%60) + ' min';
}

function buildTimeOptions(){
  var ds = '';
  for (var i = 0; i < CONFIG.DURATIONS.length; i++){
    var d = CONFIG.DURATIONS[i];
    ds += '<option value="' + d + '"' + (d === 60 ? ' selected' : '') + '>' + fmtMins(d) + '</option>';
  }
  $('fDur').innerHTML = ds;

  var ms = '';
  for (var n = 1; n <= CONFIG.MAX_MODULES; n++){
    var lbl = n + (n === 1 ? ' módulo' : ' módulos') + ' (' + fmtMins(n * CONFIG.MODULE_MINUTES) + ')';
    ms += '<option value="' + n + '">' + lbl + '</option>';
  }
  $('fMods').innerHTML = ms;
}

function setTimeMode(m){
  state.form.timeMode = m;
  $('modeManual').className = m === 'manual' ? 'chip on' : 'chip';
  $('modeSec').className = m === 'sec' ? 'chip on' : 'chip';
  $('durField').style.display = m === 'manual' ? 'block' : 'none';
  $('modsField').style.display = m === 'sec' ? 'block' : 'none';
  showMsg('');
}
$('modeManual').onclick = function(){ touch(); setTimeMode('manual'); };
$('modeSec').onclick = function(){ touch(); setTimeMode('sec'); };

function buildDayChips(){
  var html = '', today = startOfDay(new Date());
  for (var i = 0; i < CONFIG.BOOK_DAYS_AHEAD; i++){
    var d = addDays(today, i);
    var label = i === 0 ? 'Hoy' : (i === 1 ? 'Mañana' : DOW[d.getDay()] + ' ' + d.getDate());
    var on = sameDay(d, state.form.day) ? ' on' : '';
    html += '<button class="chip' + on + '" data-d="' + ymd(d) + '">' + label + '</button>';
  }
  $('dayChips').innerHTML = html;
  var chips = $('dayChips').getElementsByTagName('button');
  for (var k = 0; k < chips.length; k++){
    chips[k].onclick = function(){
      var p = this.getAttribute('data-d').split('-');
      state.form.day = new Date(+p[0], +p[1] - 1, +p[2]);
      buildDayChips();
      showMsg('');
    };
  }
}

function nextSlot(){
  var n = new Date();
  var m = Math.ceil(n.getMinutes() / CONFIG.SLOT_MINUTES) * CONFIG.SLOT_MINUTES;
  n.setMinutes(m, 0, 0);
  if (n.getHours() < CONFIG.OPEN_HOUR) n.setHours(CONFIG.OPEN_HOUR, 0, 0, 0);
  if (n.getHours() >= CONFIG.CLOSE_HOUR) return pad2(CONFIG.OPEN_HOUR) + ':00';
  return hhmm(n);
}

function openBook(){
  state.form.day = startOfDay(new Date());
  buildDayChips();
  $('fStart').value = nextSlot();
  $('fTitle').value = '';
  $('fWho').value = '';
  $('fNotes').value = '';
  $('fPin').value = '';
  $('pinField').style.display = CONFIG.PIN ? 'block' : 'none';
  setTimeMode(state.form.timeMode);
  showMsg('');
  $('shade').className = 'on';
  $('sheet').className = 'open';
  $('fTitle').focus();
}
function closeBook(){ $('sheet').className = ''; $('shade').className = ''; touch(); }
$('shade').onclick = closeBook;

function showMsg(txt, bad){
  var m = $('msg');
  if (!txt){ m.className = ''; m.textContent = ''; return; }
  m.className = bad ? 'on bad' : 'on';
  m.innerHTML = txt;
}

$('openBook').onclick = function(){ touch(); openBook(); };
$('closeBook').onclick = closeBook;
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeBook();
});

$('saveBook').onclick = function(){
  touch();
  var title = $('fTitle').value.replace(/^\s+|\s+$/g, '');
  if (!title){ showMsg('Falta el nombre de la actividad.', true); $('fTitle').focus(); return; }
  if (CONFIG.PIN && $('fPin').value.replace(/^\s+|\s+$/g,'') !== CONFIG.PIN){
    showMsg('El código de gestión no coincide.', true); return;
  }

  var t = $('fStart').value;
  if (!/^\d{1,2}:\d{2}/.test(t)){
    showMsg('Falta la hora de inicio (por ejemplo 09:30).', true); $('fStart').focus(); return;
  }
  var p = t.split(':');
  var start = new Date(state.form.day.getTime());
  start.setHours(+p[0], +p[1], 0, 0);
  var dur = state.form.timeMode === 'sec'
    ? parseInt($('fMods').value, 10) * CONFIG.MODULE_MINUTES
    : parseInt($('fDur').value, 10);
  var end = new Date(start.getTime() + dur * 60000);

  var payload = {
    action: 'create',
    title: title,
    who: $('fWho').value.replace(/^\s+|\s+$/g, ''),
    notes: $('fNotes').value,
    start: isoLocal(start),
    end: isoLocal(end),
    pin: $('fPin').value
  };

  $('saveBook').disabled = true;
  showMsg('Guardando');
  apiCreate(payload, function(err, res){
    $('saveBook').disabled = false;
    if (err){ showMsg('No se pudo guardar: la tablet no llega al calendario. Revisá la conexión y probá de nuevo.', true); return; }
    if (!res.ok){
      if (res.conflict){
        showMsg('Ese horario ya está tomado por <b>' + esc(res.conflict) + '</b>. Elegí otro.', true);
      } else {
        showMsg('No se pudo guardar: ' + esc(res.error || 'error del calendario'), true);
      }
      return;
    }
    closeBook();
    state.mode = 'week';
    state.anchor = new Date(start.getTime());
    render();
    load();
  });
};

// ISO local sin zona: el servidor lo interpreta en la zona del calendario.
function isoLocal(d){
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) +
         'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':00';
}

/* ============================================================
   8. MODO KIOSCO
   ============================================================ */
function touch(){ state.lastTouch = Date.now(); }
document.addEventListener('touchstart', touch, true);
document.addEventListener('mousedown', touch, true);

function tickClock(){
  var n = new Date();
  $('clock').textContent = hhmm(n);
  $('todayLabel').textContent = DOW_LONG[n.getDay()] + ' ' + n.getDate() + ' ' + MONTHS[n.getMonth()].slice(0,3);
}

var lastDay = ymd(new Date());
function heartbeat(){
  tickClock();

  // Cambió el día: reencuadrar sí o sí.
  var today = ymd(new Date());
  if (today !== lastDay){ lastDay = today; goToday(); return; }

  // Sin tocar por un rato: volver a la vista por defecto.
  if (Date.now() - state.lastTouch > CONFIG.IDLE_RESET_MS){
    var want = CONFIG.SHOW_MONTH_ON_IDLE ? 'month' : 'week';
    var offAnchor = !sameDay(state.anchor, new Date());
    if (state.mode !== want || offAnchor){
      state.mode = want;
      state.anchor = new Date();
      render();
      load();
    } else {
      render(); // repinta "en curso" y lo ya pasado
    }
  } else {
    render();
  }
}
setInterval(heartbeat, 20000);
setInterval(load, CONFIG.REFRESH_MS);

// Pantalla siempre encendida donde el navegador lo permita.
var wakeLock = null;
function keepAwake(){
  if (!navigator.wakeLock) return;
  navigator.wakeLock.request('screen').then(function(l){
    wakeLock = l;
    l.addEventListener('release', function(){ wakeLock = null; });
  }).catch(function(){});
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible'){ keepAwake(); load(); }
});

/* ============================================================
   9. ARRANQUE
   ============================================================ */
buildTimeOptions();
buildDayChips();
tickClock();
render();
if (CONFIG.API_URL.indexOf('PEGAR_ACA') === 0){
  $('view').innerHTML = '<div class="empty" style="padding:28px 16px;font-size:16px;letter-spacing:.06em;text-transform:none;opacity:1">' +
    'Falta conectar el calendario. Abrí <b>index.html</b>, pegá la URL de la Web App de Apps Script en <b>CONFIG.API_URL</b> y volvé a cargar.</div>';
  setStatus('Sin configurar');
} else {
  load();
  keepAwake();
}
</script>
</body>
</html>
